name: Build CyberWarrior

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_name: linux
          - os: windows-latest
            target_name: windows
          - os: macos-latest
            target_name: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # --- Linux system deps ---
      # webkit/gtk for eframe's native file dialogs (rfd) and window chrome,
      # libpcap for Network Monitor's packet capture, openssl for reqwest/lettre TLS.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libpcap-dev \
            libssl-dev \
            pkg-config \
            libxdo-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      # --- Windows: pnet (Network Monitor's packet capture) needs the Npcap
      # SDK's Packet.lib at *compile* time (separate from the Npcap runtime
      # driver a user installs to actually capture packets at runtime).
      # This downloads the free SDK zip and points the linker at it.
      - name: Install Npcap SDK (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile npcap-sdk.zip
          Expand-Archive npcap-sdk.zip -DestinationPath npcap-sdk
          echo "LIB=$pwd\npcap-sdk\Lib\x64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build (release)
        run: cargo build --release --verbose

      # --- Package into something a person can actually double-click ---

      - name: Package Linux (.tar.gz + .desktop)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist/cyberwarrior-linux
          cp target/release/cyberwarrior dist/cyberwarrior-linux/cyberwarrior-bin
          cp assets/icon.png dist/cyberwarrior-linux/

          # egui's clipboard support (via arboard) links against libxdo at
          # runtime. It's present on this runner but NOT guaranteed on an
          # end user's machine, which would otherwise fail at launch with
          # "libxdo.so.3: cannot open shared object file". Bundle the .so
          # next to the binary and point LD_LIBRARY_PATH at it via a small
          # launcher, so nobody has to apt-install anything.
          LIBXDO_PATH=$(ldconfig -p | grep 'libxdo\.so\.3' | awk '{print $NF}' | head -n1)
          if [ -n "$LIBXDO_PATH" ]; then
            cp "$LIBXDO_PATH" dist/cyberwarrior-linux/
          else
            echo "::warning::libxdo.so.3 not found on this runner — the packaged app may fail to launch on machines without it installed"
          fi

          cat > dist/cyberwarrior-linux/cyberwarrior <<'EOF'
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$DIR:$LD_LIBRARY_PATH"
          exec "$DIR/cyberwarrior-bin" "$@"
          EOF
          chmod +x dist/cyberwarrior-linux/cyberwarrior dist/cyberwarrior-linux/cyberwarrior-bin

          cat > dist/cyberwarrior-linux/cyberwarrior.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=CyberWarrior
          Comment=Defensive security dashboard
          Exec=./cyberwarrior
          Icon=icon.png
          Terminal=false
          Categories=Security;System;
          EOF
          tar -czf dist/CyberWarrior-linux.tar.gz -C dist cyberwarrior-linux

      - name: Package macOS (.app bundle)
        if: matrix.os == 'macos-latest'
        run: |
          APP=dist/CyberWarrior.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/cyberwarrior "$APP/Contents/MacOS/CyberWarrior"
          chmod +x "$APP/Contents/MacOS/CyberWarrior"

          # Build a proper .icns from the source PNG so it shows correctly
          # in the Dock/Finder, not just as the raw square PNG.
          mkdir icon.iconset
          sips -z 16 16     assets/icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     assets/icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     assets/icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   assets/icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   assets/icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/icon.png --out icon.iconset/icon_512x512.png
          cp assets/icon.png icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/CyberWarrior.icns"

          cat > "$APP/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>CyberWarrior</string>
            <key>CFBundleDisplayName</key><string>CyberWarrior</string>
            <key>CFBundleIdentifier</key><string>com.cyberwarrior.app</string>
            <key>CFBundleVersion</key><string>1.0</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleExecutable</key><string>CyberWarrior</string>
            <key>CFBundleIconFile</key><string>CyberWarrior.icns</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF

          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/CyberWarrior-macos.zip
        # Note: this .app is unsigned. On first launch, macOS Gatekeeper will
        # block it ("can't be opened because Apple cannot check it for
        # malicious software") until the person right-clicks → Open, or an
        # Apple Developer ID signs + notarizes it. That's a paid Apple
        # account and a separate signing step — flagging it rather than
        # pretending this .app is store-ready.

      - name: Package Windows (.zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\CyberWarrior-windows | Out-Null
          Copy-Item target\release\cyberwarrior.exe dist\CyberWarrior-windows\
          Copy-Item assets\icon.png dist\CyberWarrior-windows\
          Compress-Archive -Path dist\CyberWarrior-windows\* -DestinationPath dist\CyberWarrior-windows.zip
        # Note: Network Monitor's packet capture also needs the Npcap
        # *runtime* driver installed on the machine running the app (not
        # just the SDK used to build it) — https://npcap.com/#download.
        # A real MSI installer could bundle that; this zip does not.

      - name: Build .appxbundle (Store package)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          APPX_IDENTITY_NAME: ${{ vars.APPX_IDENTITY_NAME }}
          APPX_PUBLISHER: ${{ vars.APPX_PUBLISHER }}
          APPX_PUBLISHER_DISPLAY_NAME: ${{ vars.APPX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $identityName = if ($env:APPX_IDENTITY_NAME) { $env:APPX_IDENTITY_NAME } else { "CyberWarrior.Unconfigured" }
          $publisher = if ($env:APPX_PUBLISHER) { $env:APPX_PUBLISHER } else { "CN=00000000-0000-0000-0000-000000000000" }
          $publisherDisplay = if ($env:APPX_PUBLISHER_DISPLAY_NAME) { $env:APPX_PUBLISHER_DISPLAY_NAME } else { "Unconfigured Publisher" }
          if (-not $env:APPX_IDENTITY_NAME) {
            Write-Host "::warning::APPX_IDENTITY_NAME/APPX_PUBLISHER repo variables aren't set — building with placeholder identity. This .appxbundle will sideload-test fine but Partner Center will reject it until you set those (see packaging/appx/README.md)."
          }

          $stage = "appx-stage"
          New-Item -ItemType Directory -Force -Path "$stage\Assets" | Out-Null
          Copy-Item target\release\cyberwarrior.exe "$stage\cyberwarrior.exe"

          # Store-required asset sizes, generated from the one source logo.
          magick assets\icon.png -resize 44x44 "$stage\Assets\Square44x44Logo.png"
          magick assets\icon.png -resize 150x150 "$stage\Assets\Square150x150Logo.png"
          magick assets\icon.png -resize 50x50 "$stage\Assets\StoreLogo.png"
          magick assets\icon.png -resize 310x310 -background none -gravity center -extent 310x150 "$stage\Assets\Wide310x150Logo.png"
          magick assets\icon.png -resize 300x300 -background "#121214" -gravity center -extent 620x300 "$stage\Assets\SplashScreen.png"

          $version = "${{ github.run_number }}"
          (Get-Content packaging\appx\AppxManifest.xml.template) `
            -replace '__IDENTITY_NAME__', $identityName `
            -replace '__PUBLISHER__', $publisher `
            -replace '__PUBLISHER_DISPLAY_NAME__', $publisherDisplay `
            -replace '__VERSION__', "1.0.$version" `
            | Set-Content "$stage\AppxManifest.xml"

          $sdkBin = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } | Sort-Object Name -Descending | Select-Object -First 1
          $makeappx = Join-Path $sdkBin.FullName "x64\makeappx.exe"

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $makeappx pack /d $stage /p dist\CyberWarrior-x64.appx /o

          $bundleStage = "appx-bundle-stage"
          New-Item -ItemType Directory -Force -Path $bundleStage | Out-Null
          Copy-Item dist\CyberWarrior-x64.appx $bundleStage\
          & $makeappx bundle /d $bundleStage /p dist\CyberWarrior.appxbundle /o
        # This produces an UNSIGNED .appxbundle. That's fine for Partner
        # Center upload (it signs on ingestion) but Windows won't install
        # it directly on a test machine without either the placeholder-cert
        # workaround in packaging/appx/create-test-cert-and-install.ps1, or
        # a real Partner Center identity + your own signing step.

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberWarrior-${{ matrix.target_name }}
          path: dist/CyberWarrior-${{ matrix.target_name }}.*
          if-no-files-found: error

      - name: Upload .appxbundle
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: CyberWarrior-appxbundle
          path: dist/CyberWarrior.appxbundle
          if-no-files-found: error
